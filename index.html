<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWeb 0.3</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    height: 100%;
    display: block;
}

/* CROSSHAIR */

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
    box-shadow: 0 0 2px black;
}

#crosshair::before {
    width: 2px;
    height: 16px;
    left: 7px;
    top: 0;
}

#crosshair::after {
    width: 16px;
    height: 2px;
    left: 0;
    top: 7px;
}

/* MENU */

#menu {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.78);
    color: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    z-index: 20;
    width: min(90%, 400px);
}

#menu h1 {
    margin-top: 0;
    font-size: 34px;
}

#menu button {
    border: none;
    background: #4caf50;
    color: white;
    padding: 12px 30px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
}

#menu button:hover {
    background: #43a047;
}

/* INFO */

#info {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    background: rgba(0,0,0,0.45);
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
    line-height: 1.4;
}

/* HOTBAR */

#hotbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 5px;
    background: rgba(0,0,0,0.45);
    border-radius: 6px;
    z-index: 10;
}

.slot {
    width: 54px;

    border: 3px solid #777;
    background: rgba(40,40,40,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.slot.selected {
    border-color: white;
}

.slot-number {
    position: absolute;
    top: 2px;
    left: 5px;
    color: white;
    font-size: 12px;
    text-shadow: 1px 1px 2px black;
}

.block-icon {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(0,0,0,0.25);
}

.grass-icon {
    background: #55aa35;
}

.dirt-icon {
    background: #8b5a2b;
}

.stone-icon {
    background: #888888;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair"></div>

<div id="info">
    WASD = Move<br>
    SPACE = Jump<br>
    Mouse = Look<br>
    Left Click = Break<br>
    Right Click = Place<br>
    1 / 2 / 3 = Select Block<br>
    Scroll = Change Block<br>
    ESC = Release Mouse
</div>

<div id="hotbar">

    <div class="slot selected" data-slot="0">
        <span class="slot-number">1</span>
        <div class="block-icon grass-icon"></div>
    </div>

    <div class="slot" data-slot="1">
        <span class="slot-number">2</span>
        <div class="block-icon dirt-icon"></div>
    </div>

    <div class="slot" data-slot="2">
        <span class="slot-number">3</span>
        <div class="block-icon stone-icon"></div>
    </div>

</div>

<div id="menu">

    <h1>BlockWeb</h1>

    <p>Browser Voxel Engine — 0.3</p>

    <p>
        Gravity and collision are now enabled.
    </p>

    <p>
        Click PLAY to enter the world.
    </p>

    <button id="play">PLAY</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BLOCKWEB 0.3
   ========================================================= */


/* =========================================================
   THREE.JS
   ========================================================= */

const canvas =
    document.getElementById("game");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87CEEB);

scene.fog =
    new THREE.Fog(
        0x87CEEB,
        25,
        100
    );


const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        200
    );


const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =========================================================
   LIGHTING
   ========================================================= */

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x668855,
        1.8
    );

scene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,
    50,
    20
);

scene.add(
    sun
);


/* =========================================================
   BLOCK MATERIALS
   ========================================================= */

const grassMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x55aa35
    });


const dirtMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x8b5a2b
    });


const stoneMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x888888
    });


const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


/* =========================================================
   BLOCK TYPES
   ========================================================= */

const blockTypes = [

    {
        name: "Grass",
        material: grassMaterial
    },

    {
        name: "Dirt",
        material: dirtMaterial
    },

    {
        name: "Stone",
        material: stoneMaterial
    }

];


let selectedBlock = 0;


/* =========================================================
   WORLD
   ========================================================= */

const world = [];


function addBlock(
    x,
    y,
    z,
    material,
    type = 0
) {

    const block =
        new THREE.Mesh(
            blockGeometry,
            material
        );

    block.position.set(
        x,
        y,
        z
    );

    block.userData.type =
        type;

    scene.add(
        block
    );

    world.push(
        block
    );

    return block;
}


function removeBlock(block) {

    scene.remove(
        block
    );

    const index =
        world.indexOf(
            block
        );

    if (index !== -1) {

        world.splice(
            index,
            1
        );
    }
}


/* =========================================================
   TERRAIN GENERATION
   ========================================================= */

for (
    let x = -20;
    x <= 20;
    x++
) {

    for (
        let z = -20;
        z <= 20;
        z++
    ) {

        const height =
            Math.floor(
                2 +
                Math.sin(
                    x * 0.35
                ) * 1.2 +
                Math.cos(
                    z * 0.3
                ) * 1.2
            );


        for (
            let y = 0;
            y <= height;
            y++
        ) {

            let material;
            let type;


            if (
                y === height
            ) {

                material =
                    grassMaterial;

                type = 0;

            }
            else if (
                y >= height - 2
            ) {

                material =
                    dirtMaterial;

                type = 1;

            }
            else {

                material =
                    stoneMaterial;

                type = 2;
            }


            addBlock(
                x,
                y,
                z,
                material,
                type
            );
        }
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            8,
            8
        ),

    velocity:
        new THREE.Vector3(),

    width: 0.7,

    height: 1.8,

    eyeHeight: 1.62,

    speed: 5.5,

    jumpPower: 8,

    gravity: 22,

    onGround: false
};


camera.position.set(
    player.position.x,
    player.position.y +
        player.eyeHeight,
    player.position.z
);


/* =========================================================
   INPUT
   ========================================================= */

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;


        if (
            event.code === "Space"
        ) {

            if (
                player.onGround
            ) {

                player.velocity.y =
                    player.jumpPower;

                player.onGround =
                    false;
            }
        }


        if (
            event.code === "Digit1"
        ) {
            selectBlock(0);
        }


        if (
            event.code === "Digit2"
        ) {
            selectBlock(1);
        }


        if (
            event.code === "Digit3"
        ) {
            selectBlock(2);
        }
    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


/* =========================================================
   MOUSE LOOK
   ========================================================= */

let yaw = 0;
let pitch = 0;


document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement
            !== canvas
        ) {
            return;
        }


        yaw -=
            event.movementX *
            0.002;


        pitch -=
            event.movementY *
            0.002;


        const limit =
            Math.PI / 2 -
            0.05;


        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );
    }
);


/* =========================================================
   POINTER LOCK
   ========================================================= */

const menu =
    document.getElementById(
        "menu"
    );


const playButton =
    document.getElementById(
        "play"
    );


playButton.addEventListener(
    "click",
    () => {

        menu.style.display =
            "none";

        canvas.requestPointerLock();
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            document.pointerLockElement
            !== canvas
        ) {

            menu.style.display =
                "block";
        }
    }
);


/* =========================================================
   COLLISION HELPERS
   ========================================================= */


/*
    Returns true if the player's
    bounding box overlaps a block.
*/

function playerCollides(
    position
) {

    const halfWidth =
        player.width / 2;


    const playerBox =
        new THREE.Box3(
            new THREE.Vector3(
                position.x -
                    halfWidth,
                position.y,
                position.z -
                    halfWidth
            ),

            new THREE.Vector3(
                position.x +
                    halfWidth,
                position.y +
                    player.height,
                position.z +
                    halfWidth
            )
        );


    for (
        const block of world
    ) {

        const blockBox =
            new THREE.Box3().setFromCenterAndSize(
                block.position,
                new THREE.Vector3(
                    1,
                    1,
                    1
                )
            );


        if (
            playerBox.intersectsBox(
                blockBox
            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   MOVEMENT + COLLISION
   ========================================================= */

function updatePlayer(delta) {

    const input =
        new THREE.Vector3();


    /*
       W = forward
       S = backward
       A = left
       D = right
    */

    if (
        keys["KeyW"]
    ) {
        input.z -= 1;
    }


    if (
        keys["KeyS"]
    ) {
        input.z += 1;
    }


    if (
        keys["KeyA"]
    ) {
        input.x -= 1;
    }


    if (
        keys["KeyD"]
    ) {
        input.x += 1;
    }


    if (
        input.length() > 0
    ) {

        input.normalize();
    }


    /* Camera-relative movement */

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const movement =
        new THREE.Vector3();


    movement.addScaledVector(
        forward,
        -input.z
    );


    movement.addScaledVector(
        right,
        input.x
    );


    if (
        movement.length() > 0
    ) {

        movement.normalize();
    }


    /* Horizontal movement */

    const newX =
        player.position.clone();

    newX.x +=
        movement.x *
        player.speed *
        delta;


    if (
        !playerCollides(
            newX
        )
    ) {

        player.position.x =
            newX.x;
    }


    const newZ =
        player.position.clone();

    newZ.z +=
        movement.z *
        player.speed *
        delta;


    if (
        !playerCollides(
            newZ
        )
    ) {

        player.position.z =
            newZ.z;
    }


    /* Gravity */

    player.velocity.y -=
        player.gravity *
        delta;


    /* Vertical movement */

    const newY =
        player.position.clone();

    newY.y +=
        player.velocity.y *
        delta;


    if (
        !playerCollides(
            newY
        )
    ) {

        player.position.y =
            newY.y;

        player.onGround =
            false;

    }
    else {

        /*
            We collided vertically.
            Find whether we're falling
            or jumping.
        */

        if (
            player.velocity.y < 0
        ) {

            /*
                Falling onto a block.
            */

            player.onGround =
                true;

            player.velocity.y =
                0;

            /*
                Move upward slightly
                until we're no longer
                intersecting.
            */

            while (
                playerCollides(
                    player.position
                )
            ) {

                player.position.y +=
                    0.01;
            }

        }
        else {

            /*
                Hit ceiling.
            */

            player.velocity.y =
                0;

            while (
                playerCollides(
                    player.position
                )
            ) {

                player.position.y -=
                    0.01;
            }
        }
    }


    /* Respawn if we fall */

    if (
        player.position.y < -20
    ) {

        player.position.set(
            0,
            10,
            8
        );

        player.velocity.set(
            0,
            0,
            0
        );
    }


    /* Camera */

    camera.position.set(
        player.position.x,
        player.position.y +
            player.eyeHeight,
        player.position.z
    );


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;
}


/* =========================================================
   RAYCASTING
   ========================================================= */

const raycaster =
    new THREE.Raycaster();


raycaster.far = 8;


function getTargetBlock() {

    raycaster.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const hits =
        raycaster.intersectObjects(
            world,
            false
        );


    if (
        hits.length === 0
    ) {

        return null;
    }


    return hits[0];
}


/* =========================================================
   BLOCK OUTLINE
   ========================================================= */

const outlineGeometry =
    new THREE.EdgesGeometry(
        blockGeometry
    );


const outlineMaterial =
    new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9
    });


const outline =
    new THREE.LineSegments(
        outlineGeometry,
        outlineMaterial
    );


outline.visible =
    false;


scene.add(
    outline
);


function updateOutline() {

    const hit =
        getTargetBlock();


    if (!hit) {

        outline.visible =
            false;

        return;
    }


    outline.position.copy(
        hit.object.position
    );


    outline.scale.set(
        1.01,
        1.01,
        1.01
    );


    outline.visible =
        true;
}


/* =========================================================
   BREAK + PLACE
   ========================================================= */

canvas.addEventListener(
    "mousedown",
    event => {

        if (
            document.pointerLockElement
            !== canvas
        ) {
            return;
        }


        /* LEFT CLICK */

        if (
            event.button === 0
        ) {

            const hit =
                getTargetBlock();


            if (!hit) {
                return;
            }


            if (
                world.length <= 1
            ) {
                return;
            }


            removeBlock(
                hit.object
            );
        }


        /* RIGHT CLICK */

        if (
            event.button === 2
        ) {

            const hit =
                getTargetBlock();


            if (!hit) {
                return;
            }


            const block =
                hit.object;


            const normal =
                hit.face.normal.clone();


            const position =
                block.position.clone();


            position.add(
                normal
            );


            /* Don't put block in player */

            const playerBox =
                new THREE.Box3().setFromCenterAndSize(
                    new THREE.Vector3(
                        player.position.x,
                        player.position.y +
                            player.height / 2,
                        player.position.z
                    ),

                    new THREE.Vector3(
                        player.width,
                        player.height,
                        player.width
                    )
                );


            const newBlockBox =
                new THREE.Box3().setFromCenterAndSize(
                    position,
                    new THREE.Vector3(
                        1,
                        1,
                        1
                    )
                );


            if (
                playerBox.intersectsBox(
                    newBlockBox
                )
            ) {

                return;
            }


            /* Prevent duplicates */

            for (
                const existing of world
            ) {

                if (
                    existing.position.equals(
                        position
                    )
                ) {

                    return;
                }
            }


            addBlock(
                position.x,
                position.y,
                position.z,
                blockTypes[
                    selectedBlock
                ].material,
                selectedBlock
            );
        }
    }
);


/* Disable browser right-click menu */

canvas.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);


/* =========================================================
   HOTBAR
   ========================================================= */

const slots =
    document.querySelectorAll(
        ".slot"
    );


function selectBlock(index) {

    if (
        index < 0 ||
        index >= blockTypes.length
    ) {
        return;
    }


    selectedBlock =
        index;


    slots.forEach(
        (slot, i) => {

            slot.classList.toggle(
                "selected",
                i === selectedBlock
            );
        }
    );
}


/* =========================================================
   SCROLL
   ========================================================= */

canvas.addEventListener(
    "wheel",
    event => {

        if (
            document.pointerLockElement
            !== canvas
        ) {
            return;
        }


        if (
            event.deltaY > 0
        ) {

            selectedBlock++;

            if (
                selectedBlock >=
                blockTypes.length
            ) {

                selectedBlock = 0;
            }

        }
        else {

            selectedBlock--;

            if (
                selectedBlock < 0
            ) {

                selectedBlock =
                    blockTypes.length - 1;
            }
        }


        selectBlock(
            selectedBlock
        );
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   GAME LOOP
   ========================================================= */

const clock =
    new THREE.Clock();


function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    updateOutline();


    renderer.render(
        scene,
        camera
    );
}


gameLoop();

</script>

</body>
</html>
```
