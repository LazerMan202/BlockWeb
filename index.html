<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWeb 0.8</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}
canvas{display:block}

#menu,#worldMenu,#createMenu{
    position:absolute;
    inset:0;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    z-index:20;
}
#menu{display:flex;background:rgba(0,0,0,.72)}
#worldMenu,#createMenu{display:none;background:rgba(0,0,0,.78);z-index:25}

#menu h1,#worldMenu h1,#createMenu h1{
    font-size:52px;
    margin:0 0 10px;
}
#menu h2{margin:0 0 25px;font-weight:normal}

button{
    border:0;
    padding:13px 25px;
    margin:6px;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;
}
button:hover{filter:brightness(1.15)}
.menuButton{width:220px}

#worldList{
    width:min(500px,90vw);
    max-height:50vh;
    overflow-y:auto;
    margin:10px 0;
}
.worldEntry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.12);
    padding:10px;
    margin:7px 0;
    border-radius:5px;
}
.worldInfo{text-align:left}
.worldInfo strong{display:block;font-size:18px}
.worldInfo small{opacity:.7}

input{
    width:300px;
    max-width:80vw;
    box-sizing:border-box;
    padding:12px;
    margin:7px;
    border:0;
    border-radius:5px;
    font-size:16px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    margin-left:-4px;
    margin-top:-4px;
    border:1px solid white;
    box-sizing:border-box;
    pointer-events:none;
    z-index:5;
}

#hotbar{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    z-index:5;
}

.slot{
    width:58px;
    height:54px;
    border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:10px;
    box-sizing:border-box;
    text-align:center;
    text-shadow:1px 1px 2px #000;
}

.slot.selected{
    border:3px solid white;
}

.slot .number{
    font-size:9px;
    opacity:.7;
}

.slot .count{
    font-size:14px;
    font-weight:bold;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    text-shadow:1px 1px 3px black;
    z-index:5;
    font-size:14px;
    line-height:1.5;
    pointer-events:none;
}

#inventory{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(520px,90vw);
    background:rgba(20,20,20,.95);
    border:3px solid #777;
    padding:15px;
    z-index:15;
    color:white;
    display:none;
    box-shadow:0 8px 30px #000;
}

#inventory h2{
    margin:0 0 12px;
    text-align:center;
}

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.inventorySlot{
    min-height:65px;
    background:#333;
    border:2px solid #666;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

.inventorySlot .count{
    font-size:17px;
    font-weight:bold;
    margin-top:3px;
}

#leaveButton{
    position:absolute;
    top:10px;
    right:10px;
    z-index:10;
    display:none;
    padding:9px 15px;
    font-size:14px;
}

#inventoryHint{
    text-align:center;
    margin-top:12px;
    opacity:.7;
    font-size:13px;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div id="menu">
    <h1>BlockWeb</h1>
    <h2>0.8</h2>
    <button class="menuButton" id="playButton">Worlds</button>
</div>

<div id="worldMenu">
    <h1>Worlds</h1>
    <div id="worldList"></div>
    <button class="menuButton" id="newWorldButton">Create World</button>
    <button class="menuButton" id="worldBackButton">Back</button>
</div>

<div id="createMenu">
    <h1>Create World</h1>
    <input id="worldName" placeholder="World name" maxlength="30">
    <input id="worldSeed" placeholder="Seed (optional)" maxlength="30">
    <div>
        <button id="createWorldButton">Create</button>
        <button id="createBackButton">Back</button>
    </div>
</div>

<div id="inventory">
    <h2>Inventory</h2>
    <div class="inventoryGrid" id="inventoryGrid"></div>
    <div id="inventoryHint">Press E to close</div>
</div>

<div id="crosshair"></div>

<div id="info">
    <b>BlockWeb 0.8</b><br>
    WASD — Move<br>
    Space — Jump / Fly Up<br>
    Shift — Fly Down<br>
    F — Toggle Flight<br>
    E — Inventory<br>
    Left Click — Break<br>
    Right Click — Place<br>
    1-0 — Select Block<br>
    Mouse Wheel — Select Block<br>
    ESC — Worlds
</div>

<div id="hotbar"></div>

<button id="leaveButton">Leave World</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BLOCKWEB 0.7
   0.6 FOUNDATION + ORIGINAL PIXEL TEXTURES
   ========================================================= */


/* -------------------------
   WORLD SETTINGS
   ------------------------- */

const CHUNK_SIZE = 16;
const LOAD_DISTANCE = 2;
const WORLD_BOTTOM = -8;


/* -------------------------
   THREE.JS
   ------------------------- */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        35,
        180
    );

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        300
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

document.body.appendChild(
    renderer.domElement
);


/* -------------------------
   LIGHTING
   ------------------------- */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x888888,
        1.2
    );

scene.add(hemi);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

sun.position.set(
    100,
    150,
    50
);

scene.add(sun);


/* -------------------------
   BLOCKS
   ------------------------- */

const BLOCK_GRASS = 1;
const BLOCK_DIRT = 2;
const BLOCK_STONE = 3;
const BLOCK_WOOD = 4;
const BLOCK_LEAVES = 5;
const BLOCK_BEDROCK = 6;
const BLOCK_SAND = 7;
const BLOCK_GRAVEL = 8;
const BLOCK_GLASS = 9;
const BLOCK_PLANKS = 10;
const BLOCK_BRICKS = 11;

const placeableBlocks = [
    BLOCK_GRASS,
    BLOCK_DIRT,
    BLOCK_STONE,
    BLOCK_WOOD,
    BLOCK_LEAVES,
    BLOCK_SAND,
    BLOCK_GRAVEL,
    BLOCK_GLASS,
    BLOCK_PLANKS,
    BLOCK_BRICKS
];

const blockNames = {
    1:"Grass",
    2:"Dirt",
    3:"Stone",
    4:"Wood",
    5:"Leaves",
    6:"Bedrock",
    7:"Sand",
    8:"Gravel",
    9:"Glass",
    10:"Planks",
    11:"Bricks"
};


/* =========================================================
   0.8 PIXEL TEXTURE SYSTEM
   ========================================================= */

const TILE_SIZE = 16;

const atlasCanvas =
    document.createElement("canvas");

atlasCanvas.width =
    TILE_SIZE * 4;

atlasCanvas.height =
    TILE_SIZE * 3;

const atlasContext =
    atlasCanvas.getContext("2d");

atlasContext.imageSmoothingEnabled =
    false;


/* -------------------------
   Texture helpers
   ------------------------- */

function fillTile(tx,ty,color){

    atlasContext.fillStyle = color;

    atlasContext.fillRect(
        tx*TILE_SIZE,
        ty*TILE_SIZE,
        TILE_SIZE,
        TILE_SIZE
    );
}

function pixel(tx,ty,x,y,color){

    atlasContext.fillStyle = color;

    atlasContext.fillRect(
        tx*TILE_SIZE+x,
        ty*TILE_SIZE+y,
        1,
        1
    );
}

function speckles(
    tx,
    ty,
    base,
    light,
    dark,
    amount
){

    fillTile(tx,ty,base);

    for(let i=0;i<amount;i++){

        const x =
            Math.floor(
                Math.random()*16
            );

        const y =
            Math.floor(
                Math.random()*16
            );

        pixel(
            tx,
            ty,
            x,
            y,
            Math.random()>.5
                ? light
                : dark
        );
    }
}


/* -------------------------
   Grass side
   ------------------------- */

function makeGrassSide(tx,ty){

    fillTile(
        tx,
        ty,
        "#8b5a2b"
    );

    for(let y=0;y<5;y++){

        for(let x=0;x<16;x++){

            if(
                Math.random() > .15
            ){

                pixel(
                    tx,
                    ty,
                    x,
                    y,
                    y<2
                        ? "#4d9f32"
                        : "#55aa35"
                );
            }
        }
    }

    for(let i=0;i<16;i++){

        pixel(
            tx,
            ty,
            Math.floor(Math.random()*16),
            7+Math.floor(Math.random()*9),
            Math.random()>.5
                ? "#70451f"
                : "#9a6330"
        );
    }
}


/* -------------------------
   Grass top
   ------------------------- */

function makeGrassTop(tx,ty){

    fillTile(
        tx,
        ty,
        "#55aa35"
    );

    for(let i=0;i<45;i++){

        pixel(
            tx,
            ty,
            Math.floor(Math.random()*16),
            Math.floor(Math.random()*16),
            Math.random()>.5
                ? "#62b83d"
                : "#438f2d"
        );
    }
}


/* -------------------------
   Dirt
   ------------------------- */

function makeDirt(tx,ty){

    speckles(
        tx,
        ty,
        "#8b5a2b",
        "#9b6734",
        "#70451f",
        38
    );
}


/* -------------------------
   Stone
   ------------------------- */

function makeStone(tx,ty){

    speckles(
        tx,
        ty,
        "#888888",
        "#9d9d9d",
        "#6f6f6f",
        48
    );
}


/* -------------------------
   Wood side
   ------------------------- */

function makeWoodSide(tx,ty){

    fillTile(
        tx,
        ty,
        "#6b4325"
    );

    for(let x=2;x<16;x+=4){

        atlasContext.fillStyle =
            "#4f301b";

        atlasContext.fillRect(
            tx*TILE_SIZE+x,
            ty*TILE_SIZE,
            1,
            16
        );
    }

    for(let i=0;i<20;i++){

        pixel(
            tx,
            ty,
            Math.floor(Math.random()*16),
            Math.floor(Math.random()*16),
            Math.random()>.5
                ? "#85552d"
                : "#59371e"
        );
    }
}


/* -------------------------
   Wood top
   ------------------------- */

function makeWoodTop(tx,ty){

    fillTile(
        tx,
        ty,
        "#8a5a31"
    );

    for(let r=2;r<=7;r+=2){

        for(let x=0;x<16;x++){

            const y1 =
                Math.round(
                    8 +
                    Math.sin(
                        x*.7
                    )*r
                );

            if(
                y1>=0 &&
                y1<16
            ){

                pixel(
                    tx,
                    ty,
                    x,
                    y1,
                    "#5c381e"
                );
            }
        }
    }

    pixel(
        tx,
        ty,
        8,
        8,
        "#4b2d18"
    );
}


/* -------------------------
   Leaves
   ------------------------- */

function makeLeaves(tx,ty){

    fillTile(
        tx,
        ty,
        "#2f8f35"
    );

    for(let i=0;i<60;i++){

        pixel(
            tx,
            ty,
            Math.floor(Math.random()*16),
            Math.floor(Math.random()*16),
            Math.random()>.5
                ? "#3ca342"
                : "#24742b"
        );
    }
}


/* -------------------------
   Sand
   ------------------------- */

function makeSand(tx,ty){

    speckles(
        tx,
        ty,
        "#d9c27a",
        "#ead58d",
        "#c3aa62",
        35
    );
}


/* -------------------------
   Gravel
   ------------------------- */

function makeGravel(tx,ty){

    speckles(
        tx,
        ty,
        "#777777",
        "#909090",
        "#5d5d5d",
        55
    );
}


/* -------------------------
   Glass
   ------------------------- */

function makeGlass(tx,ty){

    fillTile(
        tx,
        ty,
        "#9bd6e8"
    );

    for(let i=0;i<16;i++){

        pixel(
            tx,
            ty,
            i,
            0,
            "#d7f4ff"
        );

        pixel(
            tx,
            ty,
            0,
            i,
            "#d7f4ff"
        );
    }

    for(let i=2;i<15;i+=4){

        pixel(
            tx,
            ty,
            i,
            i,
            "#c5edf9"
        );

        pixel(
            tx,
            ty,
            i+1,
            i,
            "#c5edf9"
        );
    }
}


/* -------------------------
   Planks
   ------------------------- */

function makePlanks(tx,ty){

    fillTile(
        tx,
        ty,
        "#b57a42"
    );

    for(let y=1;y<16;y+=4){

        for(let x=0;x<16;x++){

            pixel(
                tx,
                ty,
                x,
                y,
                "#87582f"
            );
        }
    }

    for(let i=0;i<25;i++){

        pixel(
            tx,
            ty,
            Math.floor(Math.random()*16),
            Math.floor(Math.random()*16),
            Math.random()>.5
                ? "#c88d50"
                : "#9d6937"
        );
    }
}


/* -------------------------
   Bricks
   ------------------------- */

function makeBricks(tx,ty){

    fillTile(
        tx,
        ty,
        "#a84435"
    );

    atlasContext.fillStyle =
        "#713127";

    for(let y=4;y<16;y+=5){

        atlasContext.fillRect(
            tx*TILE_SIZE,
            ty*TILE_SIZE+y,
            16,
            1
        );
    }

    for(let y=0;y<16;y+=5){

        const offset =
            (Math.floor(y/5)%2)*4;

        for(
            let x=offset;
            x<16;
            x+=8
        ){

            atlasContext.fillRect(
                tx*TILE_SIZE+x,
                ty*TILE_SIZE+y,
                1,
                5
            );
        }
    }
}


/* -------------------------
   Bedrock
   ------------------------- */

function makeBedrock(tx,ty){

    speckles(
        tx,
        ty,
        "#333333",
        "#555555",
        "#1d1d1d",
        60
    );
}


/* -------------------------
   Build atlas
   ------------------------- */

/*
   Atlas layout:

   0,0 Grass Top
   1,0 Grass Side
   2,0 Dirt
   3,0 Stone

   0,1 Wood Side
   1,1 Wood Top
   2,1 Leaves
   3,1 Sand

   0,2 Gravel
   1,2 Glass
   2,2 Planks
   3,2 Bricks
*/

makeGrassTop(0,0);
makeGrassSide(1,0);
makeDirt(2,0);
makeStone(3,0);

makeWoodSide(0,1);
makeWoodTop(1,1);
makeLeaves(2,1);
makeSand(3,1);

makeGravel(0,2);
makeGlass(1,2);
makePlanks(2,2);
makeBricks(3,2);


/* -------------------------
   Atlas texture
   ------------------------- */

const atlasTexture =
    new THREE.CanvasTexture(
        atlasCanvas
    );

atlasTexture.magFilter =
    THREE.NearestFilter;

atlasTexture.minFilter =
    THREE.NearestFilter;

atlasTexture.generateMipmaps =
    false;

atlasTexture.colorSpace =
    THREE.SRGBColorSpace;


/* -------------------------
   Texture tile lookup
   ------------------------- */

const textureTiles = {

    grassTop:[0,0],
    grassSide:[1,0],
    dirt:[2,0],
    stone:[3,0],

    woodSide:[0,1],
    woodTop:[1,1],
    leaves:[2,1],
    sand:[3,1],

    gravel:[0,2],
    glass:[1,2],
    planks:[2,2],
    bricks:[3,2],
    bedrock:[0,2]
};


function getTextureTile(type,face){

    /*
       0.8 uses the actual face direction instead of
       relying on object identity. This keeps grass and
       wood top/bottom/side textures assigned correctly
       on every chunk and at chunk boundaries.
    */

    const isTop =
        face.dir[1] === 1;

    const isBottom =
        face.dir[1] === -1;

    if(type === BLOCK_GRASS){

        if(isTop){
            return textureTiles.grassTop;
        }

        if(isBottom){
            return textureTiles.dirt;
        }

        return textureTiles.grassSide;
    }

    if(type === BLOCK_WOOD){

        if(isTop || isBottom){
            return textureTiles.woodTop;
        }

        return textureTiles.woodSide;
    }

    if(type === BLOCK_DIRT){
        return textureTiles.dirt;
    }

    if(type === BLOCK_STONE){
        return textureTiles.stone;
    }

    if(type === BLOCK_LEAVES){
        return textureTiles.leaves;
    }

    if(type === BLOCK_SAND){
        return textureTiles.sand;
    }

    if(type === BLOCK_GRAVEL){
        return textureTiles.gravel;
    }

    if(type === BLOCK_GLASS){
        return textureTiles.glass;
    }

    if(type === BLOCK_PLANKS){
        return textureTiles.planks;
    }

    if(type === BLOCK_BRICKS){
        return textureTiles.bricks;
    }

    if(type === BLOCK_BEDROCK){
        return textureTiles.bedrock;
    }

    return textureTiles.stone;
}


/* -------------------------
   Texture coordinates
   ------------------------- */

function addFaceUVs(
    uvs,
    tile,
    face
){

    const tx = tile[0];
    const ty = tile[1];

    const atlasWidth = 4;
    const atlasHeight = 3;

    /*
       Slight inset prevents neighboring atlas tiles
       from bleeding into the face.
    */
    const padding = 0.0015;

    const u0 =
        tx / atlasWidth + padding;

    const u1 =
        (tx + 1) / atlasWidth - padding;

    const v0 =
        1 -
        (ty + 1) / atlasHeight +
        padding;

    const v1 =
        1 -
        ty / atlasHeight -
        padding;

    /*
       The face geometry has a different corner order
       on different directions. Keep the texture upright
       so the green grass strip stays at the top of every
       vertical grass face.
    */

    if(face.dir[1] === 1){

        // Top
        uvs.push(
            u0,v0,
            u0,v1,
            u1,v1,
            u1,v0
        );

        return;
    }

    if(face.dir[1] === -1){

        // Bottom
        uvs.push(
            u0,v1,
            u0,v0,
            u1,v0,
            u1,v1
        );

        return;
    }

    if(face.dir[0] === 1){

        // Right
        uvs.push(
            u0,v0,
            u0,v1,
            u1,v1,
            u1,v0
        );

        return;
    }

    if(face.dir[0] === -1){

        // Left
        uvs.push(
            u1,v0,
            u1,v1,
            u0,v1,
            u0,v0
        );

        return;
    }

    if(face.dir[2] === 1){

        // Front
        uvs.push(
            u1,v0,
            u0,v0,
            u0,v1,
            u1,v1
        );

        return;
    }

    // Back
    uvs.push(
        u0,v0,
        u1,v0,
        u1,v1,
        u0,v1
    );
}


/* -------------------------
   Textured material
   ------------------------- */

const blockMaterial =
    new THREE.MeshLambertMaterial({
        map:atlasTexture
    });


/* -------------------------
   INVENTORY
   ------------------------- */

const DEFAULT_INVENTORY = {

    1:20,
    2:20,
    3:20,
    4:10,
    5:10,
    7:20,
    8:20,
    9:10,
    10:20,
    11:20
};

let inventory = {};

function resetInventory(){

    inventory = {};

    for(
        const type of placeableBlocks
    ){

        inventory[type] =
            DEFAULT_INVENTORY[type] ||
            0;
    }
}

function getCount(type){

    return inventory[type] || 0;
}

function addItem(
    type,
    amount=1
){

    if(type === BLOCK_BEDROCK){
        return;
    }

    inventory[type] =
        getCount(type) + amount;

    updateHotbar();
    updateInventoryUI();
    scheduleSave();
}

function removeItem(
    type,
    amount=1
){

    if(
        getCount(type) < amount
    ){
        return false;
    }

    inventory[type] -= amount;

    updateHotbar();
    updateInventoryUI();
    scheduleSave();

    return true;
}


/* -------------------------
   BLOCK MAP / CHUNKS
   ------------------------- */

const blockMap =
    new Map();

const chunks =
    new Map();

function blockKey(x,y,z){

    return x + "," + y + "," + z;
}

function chunkKey(cx,cz){

    return cx + "," + cz;
}

function getChunkCoords(x,z){

    return {

        cx:Math.floor(
            x / CHUNK_SIZE
        ),

        cz:Math.floor(
            z / CHUNK_SIZE
        )
    };
}

function getBlock(x,y,z){

    return blockMap.get(
        blockKey(x,y,z)
    );
}


/* -------------------------
   TERRAIN
   ------------------------- */

function terrainHeight(x,z){

    const noise =
        Math.sin(x * 0.11) * 2.2 +
        Math.cos(z * 0.13) * 2.0 +
        Math.sin((x + z) * 0.045) * 3.0 +
        Math.cos((x - z) * 0.075) * 1.5;

    let h =
        Math.floor(
            6 + noise
        );

    h =
        Math.max(
            2,
            Math.min(15,h)
        );

    return h;
}

function random2D(x,z){

    const n =
        Math.sin(
            x * 127.1 +
            z * 311.7
        ) *
        43758.5453;

    return n -
        Math.floor(n);
}


/* -------------------------
   CHUNK GENERATION
   ------------------------- */

function generateChunk(cx,cz){

    const key =
        chunkKey(cx,cz);

    if(chunks.has(key)){
        return chunks.get(key);
    }

    const chunk = {

        cx:cx,
        cz:cz,
        mesh:null
    };

    chunks.set(
        key,
        chunk
    );

    const startX =
        cx * CHUNK_SIZE;

    const startZ =
        cz * CHUNK_SIZE;


    for(
        let lx=0;
        lx<CHUNK_SIZE;
        lx++
    ){

        for(
            let lz=0;
            lz<CHUNK_SIZE;
            lz++
        ){

            const x =
                startX + lx;

            const z =
                startZ + lz;

            const top =
                terrainHeight(x,z);

            for(
                let y=WORLD_BOTTOM;
                y<=top;
                y++
            ){

                let type;

                if(
                    y === WORLD_BOTTOM
                ){
                    type =
                        BLOCK_BEDROCK;
                }
                else if(
                    y === top
                ){
                    type =
                        BLOCK_GRASS;
                }
                else if(
                    y >= top - 3
                ){
                    type =
                        BLOCK_DIRT;
                }
                else{
                    type =
                        BLOCK_STONE;
                }

                const key =
                    blockKey(x,y,z);

                blockMap.set(
                    key,
                    {
                        x:x,
                        y:y,
                        z:z,
                        type:type,
                        unbreakable:
                            type ===
                            BLOCK_BEDROCK
                    }
                );
            }
        }
    }


    /* Trees */

    for(
        let lx=0;
        lx<CHUNK_SIZE;
        lx++
    ){

        for(
            let lz=0;
            lz<CHUNK_SIZE;
            lz++
        ){

            const x =
                startX + lx;

            const z =
                startZ + lz;

            const top =
                terrainHeight(x,z);

            if(
                x*x +
                (z-8)*(z-8) <
                144
            ){
                continue;
            }

            if(
                random2D(x,z) <
                0.035
            ){

                const nearby = [

                    terrainHeight(x+1,z),
                    terrainHeight(x-1,z),
                    terrainHeight(x,z+1),
                    terrainHeight(x,z-1)

                ];

                let smooth = true;

                for(
                    const h of nearby
                ){

                    if(
                        Math.abs(h-top) > 1
                    ){
                        smooth = false;
                    }
                }

                if(!smooth){
                    continue;
                }

                const trunkHeight = 4;

                for(
                    let y=1;
                    y<=trunkHeight;
                    y++
                ){

                    const key =
                        blockKey(
                            x,
                            top+y,
                            z
                        );

                    blockMap.set(
                        key,
                        {
                            x:x,
                            y:top+y,
                            z:z,
                            type:BLOCK_WOOD,
                            unbreakable:false
                        }
                    );
                }

                for(
                    let ox=-2;
                    ox<=2;
                    ox++
                ){

                    for(
                        let oz=-2;
                        oz<=2;
                        oz++
                    ){

                        for(
                            let oy=3;
                            oy<=5;
                            oy++
                        ){

                            if(
                                Math.abs(ox) === 2 &&
                                Math.abs(oz) === 2
                            ){
                                continue;
                            }

                            if(
                                oy === 5 &&
                                (
                                    Math.abs(ox)>1 ||
                                    Math.abs(oz)>1
                                )
                            ){
                                continue;
                            }

                            const bx =
                                x + ox;

                            const by =
                                top + oy;

                            const bz =
                                z + oz;

                            const bkey =
                                blockKey(
                                    bx,
                                    by,
                                    bz
                                );

                            if(
                                !blockMap.has(bkey)
                            ){

                                blockMap.set(
                                    bkey,
                                    {
                                        x:bx,
                                        y:by,
                                        z:bz,
                                        type:BLOCK_LEAVES,
                                        unbreakable:false
                                    }
                                );
                            }
                        }
                    }
                }
            }
        }
    }

    return chunk;
}

        ]

};

    faceData.bottom,

/* -------------------------
   CHUNK MESHING
   ------------------------- */

function rebuildChunkMesh(chunk){

    if(chunk.mesh){

        scene.remove(
            chunk.mesh
        );

        chunk.mesh.geometry.dispose();

        chunk.mesh = null;
    }

    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    let vertexCount = 0;

    const startX =
        chunk.cx * CHUNK_SIZE;

    const startZ =
        chunk.cz * CHUNK_SIZE;


    for(
        let lx=0;
        lx<CHUNK_SIZE;
        lx++
    ){

        for(
            let lz=0;
            lz<CHUNK_SIZE;
            lz++
        ){

            const x =
                startX + lx;

            const z =
                startZ + lz;

            for(
                let y=WORLD_BOTTOM;
                y<=20;
                y++
            ){

                const block =
                    getBlock(x,y,z);

                if(!block){
                    continue;
                }


                for(
                    const face of faceList
                ){

                    const nx =
                        x + face.dir[0];

                    const ny =
                        y + face.dir[1];

                    const nz =
                        z + face.dir[2];

                    if(
                        getBlock(nx,ny,nz)
                    ){
                        continue;
                    }


                    for(
                        const corner of face.corners
                    ){

                        positions.push(

                            x + corner[0],
                            y + corner[1],
                            z + corner[2]

                        );

                        normals.push(

                            face.dir[0],
                            face.dir[1],
                            face.dir[2]

                        );
                    }


                    const tile =
                        getTextureTile(
                            block.type,
                            face
                        );

                    addFaceUVs(
                        uvs,
                        tile,
                        face
                    );


                    indices.push(

                        vertexCount,
                        vertexCount+1,
                        vertexCount+2,

                        vertexCount,
                        vertexCount+2,
                        vertexCount+3

                    );

                    vertexCount += 4;
                }
            }
        }
    }


    if(vertexCount === 0){
        return;
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(
        "normal",
        new THREE.Float32BufferAttribute(
            normals,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(
        indices
    );

    geometry.computeBoundingSphere();


    const mesh =
        new THREE.Mesh(
            geometry,
            blockMaterial
        );

    chunk.mesh =
        mesh;

    scene.add(mesh);
}


/* -------------------------
   REBUILD NEARBY CHUNKS
   ------------------------- */

function rebuildNearbyChunks(x,z){

    const {
        cx,
        cz
    } =
        getChunkCoords(x,z);

    for(
        let dx=-1;
        dx<=1;
        dx++
    ){

        for(
            let dz=-1;
            dz<=1;
            dz++
        ){

            const chunk =
                chunks.get(
                    chunkKey(
                        cx+dx,
                        cz+dz
                    )
                );

            if(chunk){

                rebuildChunkMesh(
                    chunk
                );
            }
        }
    }
}


/* -------------------------
   CHUNK LOADING
   ------------------------- */

let lastChunkX = null;
let lastChunkZ = null;

function updateChunks(){

    const currentCX =
        Math.floor(
            player.position.x /
            CHUNK_SIZE
        );

    const currentCZ =
        Math.floor(
            player.position.z /
            CHUNK_SIZE
        );

    const movedChunk =
        currentCX !== lastChunkX ||
        currentCZ !== lastChunkZ;

    if(
        !movedChunk &&
        chunks.size > 0
    ){
        return;
    }

    lastChunkX =
        currentCX;

    lastChunkZ =
        currentCZ;

    const newlyGenerated = [];


    for(
        let dx=-LOAD_DISTANCE;
        dx<=LOAD_DISTANCE;
        dx++
    ){

        for(
            let dz=-LOAD_DISTANCE;
            dz<=LOAD_DISTANCE;
            dz++
        ){

            const cx =
                currentCX + dx;

            const cz =
                currentCZ + dz;

            const key =
                chunkKey(cx,cz);

            if(!chunks.has(key)){

                const chunk =
                    generateChunk(
                        cx,
                        cz
                    );

                newlyGenerated.push(
                    chunk
                );
            }
        }
    }


    const rebuildSet =
        new Set();


    for(
        const chunk of newlyGenerated
    ){

        for(
            let dx=-1;
            dx<=1;
            dx++
        ){

            for(
                let dz=-1;
                dz<=1;
                dz++
            ){

                const neighbor =
                    chunks.get(
                        chunkKey(
                            chunk.cx+dx,
                            chunk.cz+dz
                        )
                    );

                if(neighbor){

                    rebuildSet.add(
                        neighbor
                    );
                }
            }
        }
    }


    for(
        const chunk of rebuildSet
    ){

        rebuildChunkMesh(
            chunk
        );
    }


    for(
        const [key,chunk]
        of chunks
    ){

        const dx =
            Math.abs(
                chunk.cx -
                currentCX
            );

        const dz =
            Math.abs(
                chunk.cz -
                currentCZ
            );

        if(
            dx > LOAD_DISTANCE ||
            dz > LOAD_DISTANCE
        ){

            if(chunk.mesh){

                scene.remove(
                    chunk.mesh
                );

                chunk.mesh.geometry.dispose();

                chunk.mesh = null;
            }

            chunks.delete(key);
        }
    }
}

/* -------------------------
   BLOCK COLLISION
   ------------------------- */

function playerBoxAt(pos){

    return new THREE.Box3(

        new THREE.Vector3(
            pos.x-player.width/2,
            pos.y,
            pos.z-player.width/2
        ),

        new THREE.Vector3(
            pos.x+player.width/2,
            pos.y+player.height,
            pos.z+player.width/2
        )
    );
}


function collidesAt(pos){

    const box =
        playerBoxAt(pos);

    const minX =
        Math.floor(box.min.x);

    const maxX =
        Math.floor(box.max.x);

    const minY =
        Math.floor(box.min.y);

    const maxY =
        Math.floor(box.max.y);

    const minZ =
        Math.floor(box.min.z);

    const maxZ =
        Math.floor(box.max.z);


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                const block =
                    getBlock(
                        x,y,z
                    );

                if(!block){
                    continue;
                }


                const blockBox =
                    new THREE.Box3(

                        new THREE.Vector3(
                            x,y,z
                        ),

                        new THREE.Vector3(
                            x+1,
                            y+1,
                            z+1
                        )
                    );


                if(
                    box.intersectsBox(
                        blockBox
                    )
                ){

                    return true;
                }
            }
        }
    }

    return false;
}


/* -------------------------
   MOVEMENT
   ------------------------- */

function updatePlayer(dt){

    const forward =
        new THREE.Vector3(

            -Math.sin(
                player.yaw
            ),

            0,

            -Math.cos(
                player.yaw
            )
        );


    const right =
        new THREE.Vector3(

            Math.cos(
                player.yaw
            ),

            0,

            -Math.sin(
                player.yaw
            )
        );


    const move =
        new THREE.Vector3();


    if(keys["KeyW"])
        move.add(forward);

    if(keys["KeyS"])
        move.sub(forward);

    if(keys["KeyD"])
        move.add(right);

    if(keys["KeyA"])
        move.sub(right);


    if(move.lengthSq() > 0){

        move.normalize();
    }


    if(player.flying){

        player.velocity.x =
            move.x *
            player.speed;

        player.velocity.z =
            move.z *
            player.speed;


        if(
            !keys["Space"] &&
            !keys["ShiftLeft"] &&
            !keys["ShiftRight"]
        ){

            player.velocity.y = 0;
        }

    }
    else{

        player.velocity.x =
            move.x *
            player.speed;

        player.velocity.z =
            move.z *
            player.speed;

        player.velocity.y -=
            player.gravity *
            dt;
    }


    const nextX =
        player.position.clone();

    nextX.x +=
        player.velocity.x *
        dt;


    if(!collidesAt(nextX)){

        player.position.x =
            nextX.x;

    }
    else{

        player.velocity.x = 0;
    }


    const nextZ =
        player.position.clone();

    nextZ.z +=
        player.velocity.z *
        dt;


    if(!collidesAt(nextZ)){

        player.position.z =
            nextZ.z;

    }
    else{

        player.velocity.z = 0;
    }


    const nextY =
        player.position.clone();

    nextY.y +=
        player.velocity.y *
        dt;


    if(!collidesAt(nextY)){

        player.position.y =
            nextY.y;

        player.onGround = false;

    }
    else{

        if(
            player.velocity.y < 0
        ){

            player.onGround = true;
        }

        player.velocity.y = 0;
    }


    if(
        player.position.y <
        WORLD_BOTTOM - 20
    ){

        player.position.set(

            0,
            terrainHeight(0,8)+3,
            8

        );

        player.velocity.set(
            0,0,0
        );
    }


    camera.position.set(

        player.position.x,
        player.position.y +
            player.eyeHeight,
        player.position.z

    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;
}


/* -------------------------
   RAYCASTING
   ------------------------- */

const raycaster =
    new THREE.Raycaster();

raycaster.far = 8;


function getTargetBlock(){

    const meshes = [];


    for(
        const chunk of chunks.values()
    ){

        if(chunk.mesh){

            meshes.push(
                chunk.mesh
            );
        }
    }


    if(meshes.length === 0){

        return null;
    }


    raycaster.setFromCamera(

        new THREE.Vector2(0,0),
        camera

    );


    const hits =
        raycaster.intersectObjects(
            meshes,
            false
        );


    if(hits.length === 0){

        return null;
    }


    const hit =
        hits[0];


    const point =
        hit.point.clone();


    const normal =
        hit.face.normal.clone();


    point.sub(
        normal.multiplyScalar(.01)
    );


    const x =
        Math.floor(point.x);

    const y =
        Math.floor(point.y);

    const z =
        Math.floor(point.z);


    const block =
        getBlock(
            x,y,z
        );


    if(!block){

        return null;
    }


    return {

        block:block,

        normal:
            hit.face.normal.clone()
    };
}

                    type:"air"
                }
            );


            addItem(
                block.type,
                1
            );


            rebuildNearbyChunks(

                block.x,
                block.z

            );


            scheduleSave();

            return;
        }


        /* PLACE */

        if(e.button === 2){

            if(
                getCount(
                    selectedBlock
                ) <= 0
            ){

                return;
            }


            const nx =
                block.x +
                Math.round(
                    target.normal.x
                );

            const ny =
                block.y +
                Math.round(
                    target.normal.y
                );

            const nz =
                block.z +
                Math.round(
                    target.normal.z
                );


            const newKey =
                blockKey(
                    nx,
                    ny,
                    nz
                );


            if(blockMap.has(newKey)){

                return;
            }


            const blockBox =
                new THREE.Box3(

                    new THREE.Vector3(
                        nx,
                        ny,
                        nz
                    ),

                    new THREE.Vector3(
                        nx+1,
                        ny+1,
                        nz+1
                    )
                );


            const actualPlayerBox =
                playerBoxAt(
                    player.position
                );


            if(
                actualPlayerBox.intersectsBox(
                    blockBox
                )
            ){

                return;
            }


            if(
                !removeItem(
                    selectedBlock,
                    1
                )
            ){

                return;
            }


            blockMap.set(

                newKey,

                {
                    x:nx,
                    y:ny,
                    z:nz,
                    type:selectedBlock,
                    unbreakable:false
                }
            );


            worldChanges.set(

                newKey,

                {
                    type:selectedBlock
                }
            );


            rebuildNearbyChunks(

                nx,
                nz

            );


            scheduleSave();
        }
    }
);


renderer.domElement.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


/* -------------------------
   HOTBAR SCROLL
   ------------------------- */

renderer.domElement.addEventListener(
    "wheel",
    e => {

        if(
            !currentWorld ||
            inventoryOpen
        ){

            return;
        }


        let index =
            placeableBlocks.indexOf(
                selectedBlock
            );


        if(e.deltaY > 0){

            index++;

        }
        else{

            index--;
        }


        if(index < 0){

            index =
                placeableBlocks.length-1;
        }


        if(
            index >=
            placeableBlocks.length
        ){

            index = 0;
        }


        selectBlock(index);
    }
);


/* -------------------------
   WORLD SAVING
   ------------------------- */

const WORLDS_KEY =
    "blockweb_worlds_v1";

let currentWorld = null;

let worldChanges =
    new Map();

let saveTimer = null;


function getWorlds(){

    try{

        return JSON.parse(

            localStorage.getItem(
                WORLDS_KEY
            ) || "[]"

        );

    }
    catch(e){

        return [];
    }
}


function saveWorlds(worlds){

    localStorage.setItem(

        WORLDS_KEY,

        JSON.stringify(worlds)

    );
}


function serializeChanges(){

    const changes = [];


    for(
        const [key,value]
        of worldChanges
    ){

        changes.push({

            key:key,
            type:value.type

        });
    }


    return changes;
}


function serializeInventory(){

    return {
        ...inventory
    };
}


function saveCurrentWorld(){

    if(!currentWorld){
        return;
    }


    currentWorld.changes =
        serializeChanges();


    currentWorld.inventory =
        serializeInventory();


    currentWorld.player = {

        x:player.position.x,
        y:player.position.y,
        z:player.position.z,

        yaw:player.yaw,
        pitch:player.pitch,

        flying:player.flying
    };


    currentWorld.updatedAt =
        Date.now();


    const worlds =
        getWorlds();


    const index =
        worlds.findIndex(

            w =>
                w.id ===
                currentWorld.id

        );


    if(index >= 0){

        worlds[index] =
            currentWorld;

    }
    else{

        worlds.push(
            currentWorld
        );
    }


    saveWorlds(
        worlds
    );
}


function scheduleSave(){

    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            saveCurrentWorld,
            700
        );
}


setInterval(
    () => {

        saveCurrentWorld();

    },
    5000
);


window.addEventListener(
    "beforeunload",
    () => {

        saveCurrentWorld();
    }
);


document.addEventListener(
    "visibilitychange",
    () => {

        if(document.hidden){

            saveCurrentWorld();
        }
    }
);


/* -------------------------
   WORLD LOADING
   ------------------------- */

function clearWorld(){

    for(
        const chunk of chunks.values()
    ){

        if(chunk.mesh){

            scene.remove(
                chunk.mesh
            );

            chunk.mesh.geometry.dispose();

            chunk.mesh = null;
        }
    }


    chunks.clear();

    blockMap.clear();

    worldChanges.clear();


    lastChunkX = null;
    lastChunkZ = null;


    targetOutline.visible =
        false;
}


function loadWorld(world){

    clearWorld();


    currentWorld =
        world;


    worldChanges =
        new Map();


    for(
        const change
        of world.changes || []
    ){

        worldChanges.set(

            change.key,

            {
                type:change.type
            }

        );
    }


    resetInventory();


    if(world.inventory){

        for(
            const type
            of placeableBlocks
        ){

            if(
                typeof world.inventory[type] ===
                "number"
            ){

                inventory[type] =
                    Math.max(

                        0,

                        Math.floor(
                            world.inventory[type]
                        )

                    );
            }
        }
    }


    updateHotbar();

    updateInventoryUI();


    if(world.player){

        player.position.set(

            world.player.x,
            world.player.y,
            world.player.z

        );


        player.yaw =
            world.player.yaw || 0;


        player.pitch =
            world.player.pitch || 0;


        player.flying =
            !!world.player.flying;

    }
    else{

        player.position.set(

            0,
            terrainHeight(0,8)+3,
            8

        );


        player.yaw = 0;
        player.pitch = 0;
        player.flying = false;
    }


    const cx =
        Math.floor(

            player.position.x /
            CHUNK_SIZE

        );


    const cz =
        Math.floor(

            player.position.z /
            CHUNK_SIZE

        );


    generateChunk(
        cx,
        cz
    );


    for(
        const [key,change]
        of worldChanges
    ){

        const parts =
            key
                .split(",")
                .map(Number);


        const x = parts[0];
        const y = parts[1];
        const z = parts[2];


        if(
            change.type === "air"
        ){

            blockMap.delete(
                key
            );

        }
        else{

            blockMap.set(

                key,

                {
                    x:x,
                    y:y,
                    z:z,
                    type:change.type,
                    unbreakable:false
                }

            );
        }
    }


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "worldMenu"
    ).style.display =
        "none";


    document.getElementById(
        "createMenu"
    ).style.display =
        "none";


    document.getElementById(
        "inventory"
    ).style.display =
        "none";


    inventoryOpen =
        false;


    document.getElementById(
        "leaveButton"
    ).style.display =
        "block";


    lastChunkX = null;
    lastChunkZ = null;


    updateChunks();


    renderer.domElement
        .requestPointerLock();
}


/* -------------------------
   WORLD MENU
   ------------------------- */

function renderWorldList(){

    const list =
        document.getElementById(
            "worldList"
        );


    list.innerHTML = "";


    const worlds =
        getWorlds();


    if(worlds.length === 0){

        const empty =
            document.createElement(
                "div"
            );


        empty.textContent =
            "No worlds yet.";


        empty.style.opacity =
            ".7";


        list.appendChild(
            empty
        );


        return;
    }


    for(
        const world of worlds
    ){

        const entry =
            document.createElement(
                "div"
            );


        entry.className =
            "worldEntry";


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "worldInfo";


        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            world.name;


        const date =
            document.createElement(
                "small"
            );


        date.textContent =

            "Created " +

            new Date(
                world.createdAt
            ).toLocaleDateString();


        info.appendChild(name);
        info.appendChild(date);


        const buttons =
            document.createElement(
                "div"
            );


        const play =
            document.createElement(
                "button"
            );


        play.textContent =
            "Play";


        play.onclick =
            () => loadWorld(world);


        const del =
            document.createElement(
                "button"
            );


        del.textContent =
            "Delete";


        del.onclick =
            () => {

                if(
                    confirm(
                        'Delete "' +
                        world.name +
                        '"?'
                    )
                ){

                    const updated =
                        getWorlds().filter(

                            w =>
                                w.id !==
                                world.id

                        );


                    saveWorlds(
                        updated
                    );


                    if(
                        currentWorld &&
                        currentWorld.id ===
                        world.id
                    ){

                        currentWorld =
                            null;
                    }


                    renderWorldList();
                }
            };


        buttons.appendChild(
            play
        );

        buttons.appendChild(
            del
        );


        entry.appendChild(
            info
        );

        entry.appendChild(
            buttons
        );


        list.appendChild(
            entry
        );
    }
}


function showWorldMenu(){

    if(!currentWorld){
        return;
    }


    document.exitPointerLock();


    saveCurrentWorld();


    inventoryOpen =
        false;


    document.getElementById(
        "inventory"
    ).style.display =
        "none";


    document.getElementById(
        "leaveButton"
    ).style.display =
        "none";


    document.getElementById(
        "worldMenu"
    ).style.display =
        "flex";


    renderWorldList();
}

   MENU BUTTONS

document.getElementById(
    "playButton"

    document.getElementById(

    ).style.display =

    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";
};


document.getElementById(
    "newWorldButton"

    document.getElementById(

    ).style.display =

        "createMenu"
    ).style.display =
        "flex";


    document.getElementById(

};


document.getElementById(

).onclick = () => {

    ).style.display =

    document.getElementById(
        "worldMenu"
    ).style.display =

    renderWorldList();

document.getElementById(
    "createWorldButton"
).onclick = () => {

    let name =
        document.getElementById(
            "worldName"
        ).value.trim();


    if(!name){

        name =
            "New World";
    }


    const seed =
        document.getElementById(
            "worldSeed"
        ).value.trim();


    resetInventory();


    const world = {

        id:

            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        name:name,

        seed:seed,

        changes:[],

        inventory:
            serializeInventory(),

        player:null,

        createdAt:
            Date.now(),

        updatedAt:
            Date.now()
    };


    const worlds =
        getWorlds();


    worlds.push(
        world
    );


    saveWorlds(
        worlds
    );


    loadWorld(
        world
    );
};


/* -------------------------
   LEAVE WORLD
   ------------------------- */

document.getElementById(
    "leaveButton"
).onclick =
    () => {

        showWorldMenu();
    };


/* -------------------------
   ESC
   ------------------------- */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Escape" &&
            currentWorld
        ){

            if(inventoryOpen){

                inventoryOpen =
                    false;


                document.getElementById(
                    "inventory"
                ).style.display =
                    "none";


                if(!pointerLocked){

                    renderer.domElement
                        .requestPointerLock();
                }


                return;
            }


            if(pointerLocked){

                document.exitPointerLock();

            }
            else{

                showWorldMenu();
            }
        }
    }
);


/* -------------------------
   GAME LOOP
   ------------------------- */

let lastTime =
    performance.now();

let chunkUpdateTimer = 0;


function animate(){

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let dt =
        (now-lastTime)/1000;


    lastTime =
        now;


    dt =
        Math.min(
            dt,
            .05
        );


    if(currentWorld){

        updatePlayer(dt);


        chunkUpdateTimer +=
            dt;


        if(
            chunkUpdateTimer >= .25
        ){

            chunkUpdateTimer = 0;

            updateChunks();
        }


        updateTargetOutline();
    }


    renderer.render(
        scene,
        camera
    );
}


updateHotbar();
updateInventoryUI();

animate();


/* -------------------------
   RESIZE
   ------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );
    }
);
